name: Deploy Palier (Apartment Accounting Product)

# Separate pipeline for palier/ (formerly rentila-sync/) — own Dockerfile,
# but no Web App of its own: it runs as a sidecar container on the shared
# "Novagentic" Web App (Azure sitecontainers mode — see ../README.md
# "Deployment"), reachable at palier.novagentic.fr via proxy/nginx.conf's
# Host-based routing. A crash in this container only restarts this
# container — Novagentic keeps serving the whole time. This workflow file is
# fully independent of novagentic-deploy.yml/proxy-deploy.yml — a bad edit
# or failing job here can never block or fail those.
#
# Live since 2026-08-08: DNS CNAME, hostname binding, managed TLS cert and
# NUXT_APP_URL are all in place. Still outstanding — the webhook receivers
# are inert until these are set, since each needs the live URL registered on
# the provider side first: NUXT_BRIDGE_WEBHOOK_SECRET and
# NUXT_STRIPE_WEBHOOK_SECRET (empty in both GitHub secrets and Azure).
# See palier/README.md "Status".

on:
  push:
    branches: ["main"]
    paths:
      - "palier/**"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build + push the image to GHCR only, without updating the sitecontainer (bootstrap use: get an image into GHCR before its sitecontainer resource points at it)"
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC login to Azure
  contents: read
  packages: write   # push image to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./palier
          push: true
          tags: |
            ghcr.io/mehdi13k8/palier:${{ github.sha }}
            ghcr.io/mehdi13k8/palier:latest

  deploy:
    needs: build
    if: ${{ github.event.inputs.build_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync app settings
        env:
          NUXT_MONGODB_URI: ${{ secrets.NUXT_MONGODB_URI }}
          NUXT_ENCRYPTION_KEY: ${{ secrets.NUXT_ENCRYPTION_KEY }}
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_APP_URL: ${{ secrets.NUXT_APP_URL }}
          NUXT_BRIDGE_CLIENT_ID: ${{ secrets.NUXT_BRIDGE_CLIENT_ID }}
          NUXT_BRIDGE_CLIENT_SECRET: ${{ secrets.NUXT_BRIDGE_CLIENT_SECRET }}
          NUXT_BRIDGE_WEBHOOK_SECRET: ${{ secrets.NUXT_BRIDGE_WEBHOOK_SECRET }}
          NUXT_ENABLEBANKING_APPLICATION_ID: ${{ secrets.NUXT_ENABLEBANKING_APPLICATION_ID }}
          NUXT_ENABLEBANKING_PRIVATE_KEY_B64: ${{ secrets.NUXT_ENABLEBANKING_PRIVATE_KEY_B64 }}
          NUXT_STRIPE_SECRET_KEY: ${{ secrets.NUXT_STRIPE_SECRET_KEY }}
          NUXT_STRIPE_WEBHOOK_SECRET: ${{ secrets.NUXT_STRIPE_WEBHOOK_SECRET }}
          NUXT_STRIPE_PRICE_ID: ${{ secrets.NUXT_STRIPE_PRICE_ID }}
        run: bash scripts/push-app-settings.sh --skip-health-check

      - name: Update palier sitecontainer
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          az rest --method PUT \
            --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/Novagentic_group/providers/Microsoft.Web/sites/Novagentic/sitecontainers/palier?api-version=2023-12-01" \
            --body '{"properties":{"image":"ghcr.io/mehdi13k8/palier:${{ github.sha }}","isMain":false,"targetPort":3001}}'
