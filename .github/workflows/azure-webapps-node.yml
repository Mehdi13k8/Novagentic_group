name: Build & Deploy (containers)

# Two independent apps in this repo, one workflow file: the Novagentic
# marketing site (repo root) and rentila-sync (rentila-sync/ subfolder, own
# Dockerfile/Azure Web App). The `changes` job below decides which app(s)
# actually need a build+deploy for this push, so editing one doesn't
# needlessly rebuild/redeploy the other.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure
  contents: read
  packages: write   # push image to GHCR

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      novagentic: ${{ steps.detect.outputs.novagentic }}
      rentila_sync: ${{ steps.detect.outputs.rentila_sync }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the diff below always has a valid base to compare against

      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "novagentic=true" >> "$GITHUB_OUTPUT"
            echo "rentila_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before" 2>/dev/null; then
            # New branch, or a base commit we can't see (e.g. history was
            # rewritten) — default to "everything changed" rather than
            # risk silently skipping a real deploy.
            echo "novagentic=true" >> "$GITHUB_OUTPUT"
            echo "rentila_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          if echo "$changed" | grep -qv '^rentila-sync/'; then
            echo "novagentic=true" >> "$GITHUB_OUTPUT"
          else
            echo "novagentic=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -q '^rentila-sync/'; then
            echo "rentila_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "rentila_sync=false" >> "$GITHUB_OUTPUT"
          fi

  # --- Novagentic (marketing site) ------------------------------------------

  build-novagentic:
    needs: changes
    if: needs.changes.outputs.novagentic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mehdi13k8/novagentic:${{ github.sha }}
            ghcr.io/mehdi13k8/novagentic:latest

  deploy-novagentic:
    needs: build-novagentic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync app settings
        env:
          NUXT_ACS_CONNECTION_STRING: ${{ secrets.NUXT_ACS_CONNECTION_STRING }}
          NUXT_ACS_SENDER_ADDRESS: ${{ secrets.NUXT_ACS_SENDER_ADDRESS }}
          NUXT_CONTACT_TO: ${{ secrets.NUXT_CONTACT_TO }}
          NUXT_CONTACT_CC: ${{ secrets.NUXT_CONTACT_CC }}
        run: bash scripts/push-app-settings.sh --skip-health-check

      - uses: azure/webapps-deploy@v3
        with:
          app-name: Novagentic
          images: ghcr.io/mehdi13k8/novagentic:${{ github.sha }}

  # --- rentila-sync (separate SaaS, rentila-sync/ subfolder) ----------------
  # TODO before this can actually deploy: no Azure Web App named
  # "rentila-sync" exists yet (job will fail at azure/webapps-deploy until it
  # does), and NUXT_BRIDGE_WEBHOOK_SECRET / NUXT_STRIPE_WEBHOOK_SECRET aren't
  # set (each needs a live URL to register the webhook against first). See
  # rentila-sync/README.md "Status".

  build-rentila-sync:
    needs: changes
    if: needs.changes.outputs.rentila_sync == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./rentila-sync
          push: true
          tags: |
            ghcr.io/mehdi13k8/rentila-sync:${{ github.sha }}
            ghcr.io/mehdi13k8/rentila-sync:latest

  deploy-rentila-sync:
    needs: build-rentila-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync app settings
        env:
          # No AZURE_RESOURCE_GROUP override -> script defaults to
          # "Novagentic_group", i.e. same resource group as the marketing
          # site. Change this (and add an AZURE_RESOURCE_GROUP secret) if
          # rentila-sync's Web App ends up in a different one.
          AZURE_WEBAPP_NAME: rentila-sync
          HEALTH_URL: https://rentila-sync.azurewebsites.net/api/health
          NUXT_MONGODB_URI: ${{ secrets.NUXT_MONGODB_URI }}
          NUXT_ENCRYPTION_KEY: ${{ secrets.NUXT_ENCRYPTION_KEY }}
          NUXT_SESSION_PASSWORD: ${{ secrets.NUXT_SESSION_PASSWORD }}
          NUXT_APP_URL: ${{ secrets.NUXT_APP_URL }}
          NUXT_BRIDGE_CLIENT_ID: ${{ secrets.NUXT_BRIDGE_CLIENT_ID }}
          NUXT_BRIDGE_CLIENT_SECRET: ${{ secrets.NUXT_BRIDGE_CLIENT_SECRET }}
          NUXT_BRIDGE_WEBHOOK_SECRET: ${{ secrets.NUXT_BRIDGE_WEBHOOK_SECRET }}
          NUXT_STRIPE_SECRET_KEY: ${{ secrets.NUXT_STRIPE_SECRET_KEY }}
          NUXT_STRIPE_WEBHOOK_SECRET: ${{ secrets.NUXT_STRIPE_WEBHOOK_SECRET }}
          NUXT_STRIPE_PRICE_ID: ${{ secrets.NUXT_STRIPE_PRICE_ID }}
        run: bash scripts/push-app-settings.sh --skip-health-check

      - uses: azure/webapps-deploy@v3
        with:
          app-name: rentila-sync
          images: ghcr.io/mehdi13k8/rentila-sync:${{ github.sha }}
