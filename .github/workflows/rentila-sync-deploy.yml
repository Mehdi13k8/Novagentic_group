name: rentila-sync — Build & Deploy (container)

# Separate app living at rentila-sync/ in this same repo (see that folder's
# README) — different Docker image, different Azure Web App than the
# Novagentic marketing site's own azure-webapps-node.yml. Scoped to only run
# when that subfolder changes so it doesn't fire on every site edit.
#
# TODO before this can actually deploy: AZURE_WEBAPP_NAME below is a
# placeholder (no Azure Web App exists yet for this app), and NUXT_MONGODB_URI
# / the two webhook secrets aren't set (see rentila-sync/README.md "Status").

on:
  push:
    branches: ["main"]
    paths: ["rentila-sync/**"]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC login to Azure
  contents: read
  packages: write   # push image to GHCR

env:
  IMAGE: ghcr.io/mehdi13k8/rentila-sync
  AZURE_WEBAPP_NAME: rentila-sync   # TODO: replace once the Web App exists

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./rentila-sync
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set app settings (env vars the container needs)
        # NUXT_-prefixed: Nuxt's runtimeConfig only auto-maps env vars with
        # this prefix (NUXT_MONGODB_URI -> runtimeConfig.mongodbUri) — an
        # unprefixed Azure App Setting would silently never reach the app.
        run: |
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              NUXT_MONGODB_URI="${{ secrets.NUXT_MONGODB_URI }}" \
              NUXT_ENCRYPTION_KEY="${{ secrets.NUXT_ENCRYPTION_KEY }}" \
              NUXT_SESSION_PASSWORD="${{ secrets.NUXT_SESSION_PASSWORD }}" \
              NUXT_APP_URL="${{ secrets.NUXT_APP_URL }}" \
              NUXT_BRIDGE_CLIENT_ID="${{ secrets.NUXT_BRIDGE_CLIENT_ID }}" \
              NUXT_BRIDGE_CLIENT_SECRET="${{ secrets.NUXT_BRIDGE_CLIENT_SECRET }}" \
              NUXT_BRIDGE_WEBHOOK_SECRET="${{ secrets.NUXT_BRIDGE_WEBHOOK_SECRET }}" \
              NUXT_STRIPE_SECRET_KEY="${{ secrets.NUXT_STRIPE_SECRET_KEY }}" \
              NUXT_STRIPE_WEBHOOK_SECRET="${{ secrets.NUXT_STRIPE_WEBHOOK_SECRET }}" \
              NUXT_STRIPE_PRICE_ID="${{ secrets.NUXT_STRIPE_PRICE_ID }}"

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
