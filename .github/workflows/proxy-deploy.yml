name: Deploy proxy (shared Web App front door)

# Builds proxy/ (nginx) — the only container Azure routes internet traffic
# to on the shared "Novagentic" Web App; it host-routes to whichever of
# novagentic/palier the request is actually for (see proxy/nginx.conf).
# Rarely changes, hence its own small workflow rather than folding into
# novagentic-deploy.yml or palier-deploy.yml — independent here too, same
# reasoning as those two: a break in this file can't block either app's own
# pipeline, and vice versa.

on:
  push:
    branches: ["main"]
    paths:
      - "proxy/**"
      - "azure-compose.yml"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build + push the image only, skip applying azure-compose.yml/restarting the Web App (bootstrap use: get this image into GHCR before the first-ever compose switch, which needs all three images to already exist)"
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC login to Azure
  contents: read
  packages: write   # push image to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: |
            ghcr.io/mehdi13k8/novagentic-proxy:${{ github.sha }}
            ghcr.io/mehdi13k8/novagentic-proxy:latest

  deploy:
    needs: build
    if: ${{ github.event.inputs.build_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Apply compose config + restart shared Web App
        run: |
          az webapp config container set \
            --name Novagentic --resource-group Novagentic_group \
            --multicontainer-config-type COMPOSE \
            --multicontainer-config-file azure-compose.yml
          az webapp restart --name Novagentic --resource-group Novagentic_group
