name: Deploy proxy (shared Web App front door)

# Builds proxy/ (nginx) — the `isMain: true` sitecontainer, and so the only
# container Azure routes internet traffic to on the shared "Novagentic" Web
# App; it host-routes to whichever of novagentic/palier the request is
# actually for (see proxy/nginx.conf). Rarely changes, hence its own small
# workflow rather than folding into novagentic-deploy.yml or
# palier-deploy.yml — independent here too, same reasoning as those two: a
# break in this file can't block either app's own pipeline, and vice versa.
#
# Careful: this is the container that serves *every* hostname on the Web App.
# A broken image here takes novagentic.fr down too, not just Palier.

on:
  push:
    branches: ["main"]
    paths:
      - "proxy/**"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build + push the image to GHCR only, without updating the sitecontainer (bootstrap use: get an image into GHCR before its sitecontainer resource points at it)"
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC login to Azure
  contents: read
  packages: write   # push image to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: |
            ghcr.io/mehdi13k8/novagentic-proxy:${{ github.sha }}
            ghcr.io/mehdi13k8/novagentic-proxy:latest

  deploy:
    needs: build
    if: ${{ github.event.inputs.build_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update proxy sitecontainer
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          az rest --method PUT \
            --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/Novagentic_group/providers/Microsoft.Web/sites/Novagentic/sitecontainers/proxy?api-version=2023-12-01" \
            --body '{"properties":{"image":"ghcr.io/mehdi13k8/novagentic-proxy:${{ github.sha }}","isMain":true,"targetPort":80}}'
