name: Deploy Novagentic (marketing site)

# Default/main workflow for this repo — builds the Novagentic marketing
# site's image and pushes it live. Novagentic and Palier run as two separate
# sidecar containers on the SAME "Novagentic" Web App (Azure sitecontainers
# mode — see ../README.md "Deployment") rather than two Web Apps, so a crash
# in Palier's container can't take Novagentic down with it. The deploy step
# PUTs only this app's own `sitecontainers/novagentic` resource, SHA-pinned,
# so it no longer has to restart the whole site the way re-applying a shared
# Compose file did. This workflow file is also fully independent of
# palier-deploy.yml/proxy-deploy.yml — a bad edit or failing job in either
# of those can never block or fail this one.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "palier/**"
      - "proxy/**"
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build + push the image to GHCR only, without updating the sitecontainer (bootstrap use: get an image into GHCR before its sitecontainer resource points at it)"
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC login to Azure
  contents: read
  packages: write   # push image to GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mehdi13k8/novagentic:${{ github.sha }}
            ghcr.io/mehdi13k8/novagentic:latest

  deploy:
    needs: build
    if: ${{ github.event.inputs.build_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sync app settings
        env:
          NUXT_ACS_CONNECTION_STRING: ${{ secrets.NUXT_ACS_CONNECTION_STRING }}
          NUXT_ACS_SENDER_ADDRESS: ${{ secrets.NUXT_ACS_SENDER_ADDRESS }}
          NUXT_CONTACT_TO: ${{ secrets.NUXT_CONTACT_TO }}
          NUXT_CONTACT_CC: ${{ secrets.NUXT_CONTACT_CC }}
        run: bash scripts/push-app-settings.sh --skip-health-check

      - name: Update novagentic sitecontainer
        run: |
          SUB_ID=$(az account show --query id -o tsv)
          az rest --method PUT \
            --url "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/Novagentic_group/providers/Microsoft.Web/sites/Novagentic/sitecontainers/novagentic?api-version=2023-12-01" \
            --body '{"properties":{"image":"ghcr.io/mehdi13k8/novagentic:${{ github.sha }}","isMain":false,"targetPort":3000}}'
