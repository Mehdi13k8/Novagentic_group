worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Docker's embedded DNS (127.0.0.11 in every container on the compose
  # network) — resolving upstreams through it, instead of nginx's own
  # start-up-time lookup, means a container that isn't up yet (or that got
  # restarted with a new internal IP after a crash) doesn't leave this proxy
  # stuck on a stale/failed address. Short TTL so it re-checks often.
  resolver 127.0.0.11 valid=10s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Palier gets its own hostname (palier.novagentic.fr); everything else —
  # novagentic.fr, novagentix.fr, www.novagentic.fr, the raw
  # *.azurewebsites.net hostname, health-check probes with no Host header
  # at all — falls through to the marketing site. Each `location` resolves
  # its upstream through a variable rather than a bare proxy_pass target,
  # which is what makes the `resolver` line above actually take effect
  # instead of nginx caching the address once at boot.
  server {
    listen 80 default_server;
    server_name _;

    location / {
      set $upstream novagentic:3000;
      proxy_pass http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Azure's own edge already terminates TLS and sets this before the
      # request ever reaches this container — pass it through as-is rather
      # than hardcoding $scheme, which would always read "http" here.
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 80;
    server_name palier.novagentic.fr;

    location / {
      set $upstream palier:3000;
      proxy_pass http://$upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
