worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Azure "sitecontainers" (sidecar) mode puts every container in this Web
  # App on ONE shared localhost network namespace — no per-container
  # hostnames/DNS the way Docker Compose gave us, so novagentic and palier
  # are just ports on 127.0.0.1 from this proxy's point of view. If a sidecar
  # hasn't started yet (or restarted after a crash), nginx returns a plain
  # 502 for just that route until it's listening again — no stale-DNS
  # failure mode to worry about like the old Compose setup had, since the
  # address here never changes.
  #
  # Palier gets its own hostname (palier.novagentic.fr); everything else —
  # novagentic.fr, novagentix.fr, www.novagentic.fr, the raw
  # *.azurewebsites.net hostname, health-check probes with no Host header
  # at all — falls through to the marketing site.
  server {
    listen 80 default_server;
    server_name _;

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Azure's own edge already terminates TLS and sets this before the
      # request ever reaches this container — pass it through as-is rather
      # than hardcoding $scheme, which would always read "http" here.
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  server {
    listen 80;
    server_name palier.novagentic.fr;

    location / {
      proxy_pass http://127.0.0.1:3001;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
