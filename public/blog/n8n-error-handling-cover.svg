<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0e0e0e" />

  <!-- main flow lines -->
  <g stroke="rgba(238,226,200,0.28)" stroke-width="2" fill="none">
    <path d="M 210 300 L 420 300" />
    <path d="M 480 300 L 700 300" />
    <path d="M 760 300 L 960 300" />
  </g>

  <!-- error branch line -->
  <g stroke="#f5a524" stroke-width="2.5" stroke-dasharray="6 6" fill="none">
    <path d="M 450 330 L 450 430" />
    <path d="M 450 460 L 450 500" />
  </g>

  <!-- trigger node -->
  <circle cx="150" cy="300" r="60" fill="#0e0e0e" stroke="#f5a524" stroke-width="3" />
  <text x="150" y="306" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f5a524">TRIGGER</text>

  <!-- step nodes -->
  <g fill="#0e0e0e" stroke="#4d6bff" stroke-width="2.5">
    <rect x="420" y="270" width="60" height="60" rx="10" />
    <rect x="700" y="270" width="60" height="60" rx="10" />
  </g>

  <!-- failing node (highlighted) -->
  <rect x="420" y="270" width="60" height="60" rx="10" fill="#0e0e0e" stroke="#f5a524" stroke-width="3" stroke-dasharray="4 4" />
  <text x="450" y="255" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#f5a524">FAIL</text>

  <!-- output node -->
  <circle cx="1010" cy="300" r="50" fill="#0e0e0e" stroke="#eee2c8" stroke-width="3" />
  <text x="1010" y="306" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#eee2c8">DB</text>

  <!-- error catch node -->
  <rect x="390" y="460" width="120" height="60" rx="10" fill="#0e0e0e" stroke="#f5a524" stroke-width="2.5" />
  <text x="450" y="495" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#f5a524">ERROR TRIGGER</text>

  <!-- notify node -->
  <g stroke="rgba(238,226,200,0.28)" stroke-width="2" fill="none">
    <path d="M 510 490 L 620 490" />
  </g>
  <rect x="620" y="460" width="120" height="60" rx="10" fill="#0e0e0e" stroke="#a89b7d" stroke-width="2.5" />
  <text x="680" y="495" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#eee2c8">NOTIFY</text>

  <text x="60" y="580" font-family="Archivo, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="#eee2c8">NOVAGENTIC — ERROR HANDLING</text>
  <text x="60" y="608" font-family="IBM Plex Mono, monospace" font-size="14" fill="#a89b7d">automatisation · n8n · fiabilité</text>
</svg>
