  </g>
  <text x="120" y="360" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#a89b7d">SaaS multi-tenant</text>

  <text x="60" y="560" font-family="Archivo, sans-serif" font-weight="800" font-size="28" letter-spacing="-0.5" fill="#eee2c8">NOVAGENTIC — AUTO-HÉBERGEMENT</text>
  <text x="60" y="590" font-family="IBM Plex Mono, monospace" font-size="14" fill="#a89b7d">automatisation · n8n · conformité</text>
