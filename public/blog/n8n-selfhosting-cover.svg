  <text x="760" y="105" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#4d6bff">VOTRE INFRA</text>

  <!-- n8n node inside boundary -->
  <circle cx="620" cy="300" r="50" fill="#0e0e0e" stroke="#f5a524" stroke-width="3" />
  <text x="620" y="306" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="#f5a524">N8N</text>

  <g stroke="rgba(238,226,200,0.28)" stroke-width="2" fill="none">
    <path d="M 670 300 L 800 300" />
  </g>

  <!-- db inside boundary -->
  <rect x="800" y="255" width="90" height="90" rx="10" fill="#0e0e0e" stroke="#eee2c8" stroke-width="2.5" />
  <text x="845" y="305" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#eee2c8">DATA</text>

  <!-- lock icon -->
  <g transform="translate(890,390)">
    <rect x="0" y="18" width="34" height="26" rx="4" fill="#0e0e0e" stroke="#f5a524" stroke-width="2.5" />
    <path d="M 6 18 L 6 10 A 11 11 0 0 1 28 10 L 28 18" fill="none" stroke="#f5a524" stroke-width="2.5" />
  </g>
  <text x="907" y="465" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#a89b7d">encryption key</text>

  <!-- outside: crossed-out cloud (saas) -->
